# Maps clean alias names to TERN vocabulary instrument categories and the
# canonical quantities each category measures.
#
# vocab_keys must match the skos:prefLabel of category concepts in
# tern_vocabs_core exactly. Multiple keys can be listed when the same
# instrument type spans several vocab categories.
# Run [k for k in _get_vocab_registry()] to see available labels.

sonic_anemometer:
  vocab_keys:
    - SONIC ANEMOMETER
  quantities:
    - Diag
    - RHint
    - Tint
    - Tv
    - U
    - Ux
    - Uy
    - Uz
    - UxUy
    - UxUz
    - UyUz
    - V
    - W
    - Wd
    - Ws
    - pitch
    - roll
    - tau
    - Tstar
    - ustar

anemometer:
  vocab_keys:
    - ANEMOMETER
  quantities:
    - Ws
    - Wd

irga:
  vocab_keys:
    - IRGA
  quantities:
    - AGC
    - AH
    - CO2
    - CO2c
    - CO2Sig
    - Diag
    - H2O
    - H2OSig
    - Sco2
    - Sig
    - SigCO2
    - SigH2O
    - ps

temperature_humidity:
  vocab_keys:
    - Temperature/Humidity Sensors
    - Temperature and Moisture Probes
    - Humidity and Temperature Probe
    - TEMPERATURE PROBES
  quantities:
    - AH
    - RH
    - Rhoa
    - Rhod
    - SH
    - SHD
    - SVP
    - Ta
    - Td
    - VP
    - VPD

radiation:
  vocab_keys:
    - Radiation Sensors
    - NET RADIOMETERS
  quantities:
    - APAR
    - FAPAR
    - Fld
    - Flu
    - Fn
    - Fpard
    - Fparu
    - Fsd
    - FsdDiff
    - FsdDir
    - Fsu
    - PAR
    - Tbody
    - Tcanopy

soil_temperature:
  vocab_keys:
    - SOIL TEMPERATURE PROBE
  quantities:
    - Ts

soil_moisture:
  vocab_keys:
    - Soil Moisture Probe
    - Stevens HydraProbe
    - WCR
  quantities:
    - EC
    - Sws
    - Swp

soil_heat_flux:
  vocab_keys:
    - SOIL HEAT FLUX TRANSDUCER
  quantities:
    - Fg

precipitation:
  vocab_keys:
    - RAIN GAUGES
  quantities:
    - Precip

atmospheric_pressure:
  vocab_keys:
    - BAROMETERS
  quantities:
    - ps

logger:
  vocab_keys:
    - Recorders/Loggers
  quantities:
    - Tpanel
    - Vbat

# Compound quantities require more than one instrument type.
# Each entry lists the aliases whose instruments are needed together.
# list_instruments_for_quantity() returns a dict keyed by alias for these.
flux_quantities:
  AC:
    - irga
    - sonic_anemometer
  AT:
    - irga
    - sonic_anemometer
  CT:
    - irga
    - sonic_anemometer
  ET:
    - irga
    - sonic_anemometer
  Fco2:
    - irga
    - sonic_anemometer
  Fe:
    - irga
    - sonic_anemometer
  Fh:
    - sonic_anemometer
  Fm:
    - sonic_anemometer
  UxA:
    - irga
    - sonic_anemometer
  UxC:
    - irga
    - sonic_anemometer
  UxT:
    - sonic_anemometer
  UyA:
    - irga
    - sonic_anemometer
  UyC:
    - irga
    - sonic_anemometer
  UyT:
    - sonic_anemometer
  UzA:
    - irga
    - sonic_anemometer
  UzC:
    - irga
    - sonic_anemometer
  UzT:
    - sonic_anemometer
