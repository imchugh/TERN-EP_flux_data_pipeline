# L2 QC config for Calperum.
#
# Source: /opt/TERN_EP/site_configs/templates/L2_autogen.txt (PyFluxPro
# control file for this site's daily near-real-time L2 pass). Every entry
# there is a plain RangeCheck -- no ExcludeDates/Hours, DependencyCheck, or
# MADFilter -- so this file is range_check only. Cross-checked variable
# names against site_configs/operational/Calperum.yml's actual canonical
# names before porting; see exceptions below.
#
# NOT PORTED, deliberately:
#   - Diag_IRGA, Diag_SONIC: PyFluxPro's file gives its usual averaged-code
#     bounds (-0.5,10.5 / -0.5,20.5), but this pipeline's Diag_IRGA/
#     Diag_SONIC are raw per-period counts of flagged scans (0-18000 at
#     10 Hz/30 min), a different quantity entirely -- see
#     configs/qc/_range_defaults.yml's own note on this. Porting these
#     numbers would flag nearly every record. Left unconfigured here, so
#     the generic default ([0, 1000], from data_monitor.THRESHOLD_SPECS)
#     applies once the default-range-check precedence logic exists.
#   - CO2_IRGA_Av, CO2_IRGA_Sd: PyFluxPro's names imply CO2 mole fraction
#     (umol/mol), but Calperum's actual canonical variable for this
#     instrument channel is CO2c_IRGA_Av/Sd -- CO2 *mass concentration*
#     (mg/m^3), a different quantity with a site/air-density-dependent
#     conversion, not a fixed unit multiplier. Copying PyFluxPro's
#     mole-fraction-scaled bounds (500-2000) onto the mass-concentration
#     variable would be wrong. Left out entirely rather than guess a
#     conversion -- add CO2c_IRGA_Av/Sd bounds here once real values are
#     worked out, if wanted.
#
# RENAMED (PyFluxPro's daily/near-real-time naming vs this pipeline's
# canonical names for the same quantity):
#   - Fco2_DL -> Fco2, Fe_DL -> Fe, Fh_DL -> Fh

