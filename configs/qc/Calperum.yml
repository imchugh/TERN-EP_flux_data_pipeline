# L2 QC config for Calperum -- deltas from configs/qc/_range_defaults.yml
# only. A variable with no entry here still gets range-checked: apply_qc's
# default-fallback resolves quantity(+qualifier)/statistic from the L1
# variable itself and looks the bound up in _range_defaults.yml. Only
# variables whose PyFluxPro-sourced bound genuinely differs from that
# default are listed below -- confirmed by diffing every variable in the
# original port against the default lookup (same algorithm apply_qc uses),
# not by eye.
#
# Source: /opt/TERN_EP/site_configs/templates/L2_autogen.txt (PyFluxPro
# control file for this site's daily near-real-time L2 pass). Every entry
# there is a plain RangeCheck.
#
# NOT PORTED, deliberately:
#   - Diag_IRGA, Diag_SONIC: PyFluxPro's file gives its usual averaged-code
#     bounds (-0.5,10.5 / -0.5,20.5), but this pipeline's Diag_IRGA/
#     Diag_SONIC are raw per-period counts of flagged scans (0-18000 at
#     10 Hz/30 min), a different quantity entirely -- see
#     configs/qc/_range_defaults.yml's own note on this. Porting these
#     numbers would flag nearly every record. Left unconfigured, so the
#     generic default ([0, 1000], from data_monitor.THRESHOLD_SPECS)
#     applies.
# RENAMED (PyFluxPro's daily/near-real-time naming vs this pipeline's
# canonical names for the same quantity):
#   - Fco2_DL -> Fco2, Fe_DL -> Fe, Fh_DL -> Fh
#
# CO2_IRGA_Av/Sd -> CO2c_IRGA_Av/Sd (resolved via real-PyFluxPro-output
# benchmarking, 2026-09): PyFluxPro's "CO2_IRGA_Av" name implies mole
# fraction, but its actual output values (~700-920) are CO2 mass
# concentration, matching this pipeline's CO2c_IRGA_Av almost exactly --
# _range_defaults.yml's CO2c entry now carries these numbers directly
# (500,2000 / 0,50 / 0,2500), so CO2c_IRGA_Av needs no override here (it
# already matches the default). Only CO2c_IRGA_Sd is a genuine delta --
# Calperum's own (0,25) is tighter than the generic CO2c.Sd default (0,50),
# and covers 95.4% of real CO2c_IRGA_Sd values here.

AH_2m:                          # default (0,35) -- unqualified probe, tighter here
  range_check: {lower: 0, upper: 30}
AH_IRGA_Av:                     # default (0,35)
  range_check: {lower: 0, upper: 30}
AH_IRGA_Sd:                     # default (0,10)
  range_check: {lower: 0, upper: 2}

Fco2:                           # PyFluxPro: Fco2_DL; default (-50,30)
  range_check: {lower: -50, upper: 50}
Fe:                             # PyFluxPro: Fe_DL; default (-200,1000)
  range_check: {lower: -100, upper: 600}
Fh:                             # PyFluxPro: Fh_DL; default (-200,1000)
  range_check: {lower: -100, upper: 600}

CO2c_IRGA_Sd:                   # default (0,50); PyFluxPro: CO2_IRGA_Sd
  range_check: {lower: 0, upper: 25}

Fld:                            # default (250,700)
  range_check: {lower: 200, upper: 700}
Flu:                            # default (300,700)
  range_check: {lower: 200, upper: 700}

Sig_IRGA:                       # default (0,102.5) -- site wants signal >= 80
  range_check: {lower: 80, upper: 101}

Tv_SONIC_Sd:                    # default (0,2.236) -- site's own Sd, not derived from Vr
  range_check: {lower: 0, upper: 3}
Ux_SONIC_Sd:                    # default (0,3.162)
  range_check: {lower: 0, upper: 3}
Uy_SONIC_Sd:                    # default (0,3.162)
  range_check: {lower: 0, upper: 3}
Uz_SONIC_Sd:                    # default (0,1.414)
  range_check: {lower: 0, upper: 1.5}

ps:                             # default (95,105) -- site elevation/pressure differs
  range_check: {lower: 90.55, upper: 110.55}
