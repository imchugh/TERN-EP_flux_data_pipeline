name: ep_cntl
channels:
  - conda-forge
  - defaults
dependencies:
  - geojson
  - mkdocs
  - mkdocs-material
  - mkdocstrings-python
  - spyder-kernels=3.1.2
  - configobj
  - ephem
  - git
  - gspread
  - jinja2
  - matplotlib
  - netcdf4
  - numpy
  - oauth2client
  - openpyxl
  - pandas
  - pyyaml
  - qt
  - rich
  - scipy
  - timezonefinder
  - xarray
  - xlrd
  - xlsxwriter
  - dask-core
  - pydantic
  - pint
  - nicegui
  - rapidfuzz
  - piexif
  - cf-units
  - pip
  - pip:
      - ruff
      - git-filter-repo
      - zarr<3
      # Generic processing core (https://github.com/imchugh/fluxcore), editable
      # from a local clone so core edits take effect immediately.
      - -e /opt/TERN_EP/fluxcore
